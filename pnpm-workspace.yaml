packages:
  - .

allowBuilds:
  esbuild: false

# 重複排除
dedupePeers: true

catalog:
  japanese-holidays: 1.0.10
  rolldown: 1.2.4
  rolldown-plugin-dts: 0.28.2
  tsx: 4.23.12
  typescript: 7.0.2
  vitest: &vitest_ver 4.1.10
  yaml: 2.9.0
  '@biomejs/biome': 2.5.8
  '@holiday-jp/holiday_jp': 2.5.1
  '@types/japanese-holidays': 1.0.3
  '@types/node': 26.2.0
  '@vitest/coverage-v8': *vitest_ver

overrides:
  # CVE-2026-67213
  nanoid: ^3.3.17
  rolldown: 'catalog:'

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
